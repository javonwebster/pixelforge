user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;                 # Caddy already logs requests
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 2M;        # forms and webhooks only, no uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        root /var/www/html/public;
        index index.php;

        # Behind Caddy, so trust the forwarded scheme.
        #
        # PHP treats $_SERVER['HTTPS'] as "on" for ANY non-empty value
        # except "off", so passing "http" would mark a plain request
        # secure. Leave it empty unless the request really is https,
        # and pass it with if_not_empty below.
        set $fcgi_https "";
        if ($scheme = 'https')                 { set $fcgi_https on; }
        if ($http_x_forwarded_proto = 'https') { set $fcgi_https on; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $fcgi_https if_not_empty;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
            # Keep typical Inertia responses in memory rather than
            # spooling them to disk.
            fastcgi_buffers 16 32k;
            fastcgi_buffer_size 32k;
            internal;
        }

        # Never execute PHP found anywhere else.
        location ~ \.php$ { return 404; }

        # Vite output is content-hashed, so it can be cached forever.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~ /\.(?!well-known) { deny all; }
    }
}

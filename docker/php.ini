memory_limit = 256M
; No file uploads: reference images are URLs. Keep request bodies small.
upload_max_filesize = 2M
post_max_size = 2M
max_execution_time = 60
expose_php = Off

; PHP2Shell mitigation (CVE-2026-109619). Nothing here uses upload
; progress. Must be startup config: ini_set() and .user.ini apply too late.
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.enable_cli = 0

; Logs go to the container's stderr so `docker compose logs` shows them.
log_errors = On
error_log = /dev/stderr
display_errors = Off
